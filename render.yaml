services:
  - type: web
    name: open-guandan-server
    runtime: rust
    region: frankfurt
    plan: free
    numInstances: 1
    buildCommand: npm ci && npm run build --workspace @open-guandan/server
    startCommand: ./apps/server/target/release/open-guandan-server
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: CORS_ORIGIN
        sync: false
      - key: TRUST_PROXY
        value: "true"
      - key: ROOM_IDLE_TTL_MS
        value: "600000"
      - key: RECONNECT_GRACE_MS
        value: "90000"
