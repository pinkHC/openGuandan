[package]
name = "open-guandan-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
dotenvy = "0.15.7"
indexmap = { version = "2.14.0", features = ["serde"] }
parking_lot = "0.12.5"
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
socketioxide = { version = "0.18.6", features = ["extensions", "tracing"] }
socketioxide-core = "0.18.2"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.7.0", features = ["cors", "limit", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.24.0", features = ["serde", "v4"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
strip = true
lto = "thin"
